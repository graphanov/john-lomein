name: verify

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-15
    env:
      PYTHONHASHSEED: "0"
      UV_NO_SYSTEM_CONFIG: "1"
    steps:
      - name: Check out source without persisting credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.11.16"
          python-version: "3.11"
          enable-cache: false

      - name: Run the repository verification contract on Ubuntu
        if: runner.os == 'Linux'
        run: make clean-machine-ubuntu

      - name: Run the isolated clean-machine contract on macOS
        if: runner.os == 'macOS'
        run: make clean-machine-macos
